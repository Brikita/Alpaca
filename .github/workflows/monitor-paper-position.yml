name: Run VolGuard automated paper cycle

on:
  workflow_dispatch:
    inputs:
      run_entry:
        description: Scan and submit a fresh risk-approved paper entry after monitoring exits
        required: false
        default: false
        type: boolean
      run_replay:
        description: Refresh the one-year underlying signal replay
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: volguard-paper-trading-broker
  cancel-in-progress: false

jobs:
  monitor:
    name: Governed paper cycle
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: paper-trading
    env:
      ALPACA_LIVE_TRADE: 'false'
      VOLGUARD_EXECUTION_ENABLED: 'false'
      VOLGUARD_EXIT_ENABLED: 'paper'
      VOLGUARD_TELEMETRY_URL: ${{ secrets.VOLGUARD_TELEMETRY_URL }}
      VOLGUARD_SCAN_URL: ${{ secrets.VOLGUARD_SCAN_URL }}
      VOLGUARD_TELEMETRY_TOKEN: ${{ secrets.VOLGUARD_TELEMETRY_TOKEN }}
      VOLGUARD_SITES_BYPASS_TOKEN: ${{ secrets.VOLGUARD_SITES_BYPASS_TOKEN }}
      ALPACA_PROFILE_B64: ${{ secrets.ALPACA_PROFILE_B64 }}

    steps:
      - name: Check out the audited strategy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Use Node.js 22.13.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install verified Alpaca CLI 0.0.14
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/alpaca-cli.tar.gz \
            https://github.com/alpacahq/cli/releases/download/v0.0.14/cli_0.0.14_linux_amd64.tar.gz
          echo '6c82ef31f94dd61aae1c90e40fc41fdfaf8111bd50e9a2780b9d8d304eb2ba66  /tmp/alpaca-cli.tar.gz' \
            | sha256sum --check --strict
          tar --extract --gzip --file /tmp/alpaca-cli.tar.gz --directory /tmp
          sudo install --mode 0755 /tmp/alpaca /usr/local/bin/alpaca
          alpaca version

      - name: Restore the paper-only Alpaca profile
        shell: bash
        run: |
          mkdir --parents "$HOME/.config/alpaca/profiles"
          printf '%s' "$ALPACA_PROFILE_B64" | base64 --decode > "$HOME/.config/alpaca/profiles/paper.yaml"
          printf 'default_profile: paper\noutput: json\ncolor: false\n' > "$HOME/.config/alpaca/config.yaml"
          chmod 600 "$HOME/.config/alpaca/profiles/paper.yaml" "$HOME/.config/alpaca/config.yaml"
          alpaca doctor

      - name: Evaluate the governed paper exit
        id: monitor
        run: npm run monitor:position

      - name: Reconcile existing paper orders
        if: always()
        run: npm run reconcile:orders

      - name: Refresh the sanitized paper account snapshot
        if: ${{ inputs.run_entry }}
        run: npm run snapshot:alpaca

      - name: Scan fresh option opportunities
        if: ${{ inputs.run_entry }}
        run: npm run scan:options

      - name: Submit only a fully approved paper entry
        id: entry
        if: ${{ inputs.run_entry }}
        env:
          VOLGUARD_EXECUTION_ENABLED: 'paper'
        run: npm run execute:latest

      - name: Reconcile the new paper entry
        if: ${{ always() && inputs.run_entry }}
        run: npm run reconcile:orders

      - name: Refresh the historical signal replay
        if: ${{ inputs.run_replay }}
        run: npm run replay:strategy

      - name: Publish actionable GitHub alerts
        if: ${{ always() }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          MONITOR_RESULT: ${{ steps.monitor.outputs.result }}
          MONITOR_KEY: ${{ steps.monitor.outputs.alertKey }}
          MONITOR_MESSAGE: ${{ steps.monitor.outputs.message }}
          ENTRY_RESULT: ${{ steps.entry.outputs.result }}
          ENTRY_KEY: ${{ steps.entry.outputs.alertKey }}
          ENTRY_MESSAGE: ${{ steps.entry.outputs.message }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const alerts = [];
            if (process.env.MONITOR_RESULT === 'failed') alerts.push({ severity: 'failure', key: process.env.MONITOR_KEY, message: process.env.MONITOR_MESSAGE });
            if (process.env.MONITOR_RESULT === 'exit_submitted') alerts.push({ severity: 'trade', key: process.env.MONITOR_KEY, message: process.env.MONITOR_MESSAGE });
            if (process.env.ENTRY_RESULT === 'failed' || process.env.ENTRY_RESULT === 'submitted' || process.env.ENTRY_RESULT === 'held') {
              alerts.push({ severity: process.env.ENTRY_RESULT === 'submitted' ? 'trade' : process.env.ENTRY_RESULT === 'held' ? 'hold' : 'failure', key: process.env.ENTRY_KEY, message: process.env.ENTRY_MESSAGE });
            }
            const existing = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            for (const alert of alerts) {
              const title = `[VolGuard ${alert.severity}] ${alert.key}`.slice(0, 120);
              if (existing.data.some((issue) => issue.title === title)) continue;
              await github.rest.issues.create({
                owner, repo, title,
                body: `${alert.message}\n\n[Inspect automated run](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})\n\nPaper trading only.`,
              });
            }

      - name: Write the governed cycle summary
        if: ${{ always() }}
        shell: bash
        run: |
          echo '## VolGuard governed paper cycle' >> "$GITHUB_STEP_SUMMARY"
          echo "- Exit monitor: ${{ steps.monitor.outputs.result || steps.monitor.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Entry branch: ${{ steps.entry.outputs.result || (inputs.run_entry && steps.entry.outcome) || 'not scheduled' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Historical replay: ${{ inputs.run_replay && 'scheduled' || 'not scheduled' }}" >> "$GITHUB_STEP_SUMMARY"
          echo '- Safety boundary: paper account only' >> "$GITHUB_STEP_SUMMARY"
